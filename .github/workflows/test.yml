name: Tests

# Runs the vitest suite on PRs against main AND direct push to main. The
# push-to-main trigger mirrors edge-function-auth.yml: Lovable Cloud writes
# directly to main outside of any PR flow, so a PR-only workflow would miss
# the path most likely to introduce a regression silently.
#
# No paths filter — tests live under src/ but a dependency upgrade, a vitest
# config change, or a tsconfig tweak can also break them. Run on every change.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match edge-function-auth.yml. Reproducibility over
          # convenience — a green-to-red shift from an unchosen Bun release
          # is exactly the kind of CI flakiness that teaches teams to bypass
          # checks. Bumping this version is a deliberate, reviewed commit.
          bun-version: 1.3.13

      - name: Cache bun install cache
        # Fjerner årsagen til xlsx-tarball-flaken (BACKLOG [P4], tredje
        # forekomst 2026-08-24 på PR #413): med ~/.bun/install/cache
        # genbrugt henter install ikke tarballs fra registry, så den
        # sporadisk fejlende ekstraktion af xlsx udgår. setup-bun@v2
        # cacher kun Bun-binæren, ikke pakkerne — deraf dette skridt.
        # Nøglen invalideres når bun.lock ændres; restore-keys genbruger
        # den seneste cache alligevel, så kun ændrede pakker hentes.
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install dependencies
        # --frozen-lockfile honors bun.lockb verbatim. Deterministic install.
        run: bun install --frozen-lockfile

      - name: Typecheck
        # Kører FØR testene: en typefejl fanges før ti sekunders testkørsel.
        # `-p tsconfig.app.json` er IKKE valgfri — rodens tsconfig.json er
        # solution-style (kun references), så `tsc --noEmit` uden -p checker
        # NUL filer og er grøn uanset hvad. Forenkl den ikke væk.
        # Baselinen var NUL fejl da trinnet blev indført (7/9-2026, #675).
        # Trinnet har aldrig haft undtagelser: ingen kendt-liste, ingen
        # `|| true`, ingen continue-on-error. Nul betyder nul. Fangnettet er
        # bl.a. Record-udtømmelighed (fx FornyelseStatus), som KUN tsc
        # håndhæver — vitest ser den ikke (elleve typefejl landede på main 6/9).
        # KUN i dette job: jobbet «MCP Tests» kører samme kodebase, og et
        # typecheck dér ville betale for samme svar to gange. Fejler typerne,
        # er PR'en rød herfra. Det er en beslutning, ikke en forglemmelse.
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Run tests
        # `bun run test` invokes the package.json `test` script (vitest run).
        # NOT `bun test` — that runs Bun's built-in test runner, which does
        # not understand vitest's API and silently passes nothing.
        run: bun run test

  mcp-test:
    # Additive job for the standalone mcp/ package (its own package.json +
    # lockfile + node_modules). Kept separate from the root `test` job because
    # the MCP SDK is not in the root node_modules — see docs/mcp/RECON.md §6
    # and mcp/vitest.config.ts.
    name: MCP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache bun install cache
        # Samme værn som test-jobbet (xlsx-flaken rammer enhver frisk
        # runner). Eget nøglerum (-mcp-) så de to parallelle jobs ikke
        # kappes om at gemme samme nøgle.
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-mcp-${{ hashFiles('mcp/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-mcp-

      - name: Install dependencies (frozen)
        # --frozen-lockfile pins to mcp/bun.lock verbatim, so CI cannot drift
        # from the reviewed lockfile.
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Run MCP tests
        working-directory: mcp
        run: bun run test
