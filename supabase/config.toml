  # scripts/check-verify-jwt-invariant.ts håndhæver. Bevist 10. august
  # (PR #267): med true afviser gatewayen forfalskede signaturer før koden
  # kører; uden blok validerer den intet. get-chat-attachment-url står på
  # false fordi den er ældre end det fund — den skal migreres i et separat
  # spor og er IKKE forbilledet her.
